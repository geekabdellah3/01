<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34444a"/></marker></defs>
<rect width="1280" height="640" fill="#fff"/>
<text x="140" y="40" font-size="13" font-weight="bold" text-anchor="middle" fill="#58656a" letter-spacing="0.5">INFORMATION PROCESSING</text>
<text x="140" y="58" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#8a949a">OIPT, Galbraith (1973)</text>
<rect x="30" y="100" width="220" height="100" rx="5" fill="#f1f4f7" stroke="#71899a" stroke-width="1.5"/>
<text x="140" y="135" font-size="16" font-weight="bold" text-anchor="middle" fill="#405d73">Capacity (IPC)</text>
<text x="140" y="157" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#58656a">ability of a control</text>
<text x="140" y="174" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#58656a">to process signals</text>
<rect x="30" y="250" width="220" height="100" rx="5" fill="#eff5f1" stroke="#6d9382" stroke-width="1.5"/>
<text x="140" y="285" font-size="16" font-weight="bold" text-anchor="middle" fill="#386754">Requirements (IPR)</text>
<text x="140" y="307" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#58656a">what the control</text>
<text x="140" y="324" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#58656a">must absorb and adapt to</text>
<text x="140" y="230" font-size="13" font-weight="bold" font-style="italic" text-anchor="middle" fill="#34444a">fit ?</text>
<text x="600" y="40" font-size="13" font-weight="bold" text-anchor="middle" fill="#58656a" letter-spacing="0.5">MCS AS A PACKAGE</text>
<text x="600" y="58" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#8a949a">Malmi and Brown (2008)</text>
<rect x="300" y="80" width="600" height="340" rx="6" fill="#f8f9fa" stroke="#4f5b60" stroke-width="1.8"/>
<text x="628" y="115" font-size="13" font-weight="bold" text-anchor="end" fill="#405d73">◀ capacity face (IPC)</text>
<text x="652" y="115" font-size="13" font-weight="bold" text-anchor="start" fill="#386754">requirement face (IPR) ▶</text>
<text x="320" y="165" font-size="14" font-weight="bold" text-anchor="start" fill="#202a2b">Planning</text>
