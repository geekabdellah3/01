<text x="866.0" y="260" font-size="11.5" font-weight="normal" text-anchor="start" fill="#386754">39</text>
<text x="320" y="309" font-size="14" font-weight="bold" text-anchor="start" fill="#202a2b">Cultural</text>
<rect x="606.1538461538462" y="293" width="33.84615384615385" height="22" rx="2" fill="#a9bccb" stroke="none" stroke-width="0"/>
<text x="600.1538461538462" y="308" font-size="11.5" font-weight="normal" text-anchor="end" fill="#405d73">6</text>
<rect x="640" y="293" width="146.66666666666669" height="22" rx="2" fill="#a8c6b6" stroke="none" stroke-width="0"/>
<text x="792.6666666666667" y="308" font-size="11.5" font-weight="normal" text-anchor="start" fill="#386754">26</text>
<text x="320" y="357" font-size="14" font-weight="bold" text-anchor="start" fill="#202a2b">Reward</text>
<rect x="640" y="341" width="5.641025641025641" height="22" rx="2" fill="#a8c6b6" stroke="none" stroke-width="0"/>
<text x="651.6410256410256" y="356" font-size="11.5" font-weight="normal" text-anchor="start" fill="#386754">1</text>
<text x="630" y="356" font-size="11.5" font-weight="normal" text-anchor="end" fill="#8a949a">0</text>
