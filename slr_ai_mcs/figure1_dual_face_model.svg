<text x="320" y="261" font-size="14" font-weight="bold" text-anchor="start" fill="#202a2b">Administrative</text>
<rect x="594.8717948717949" y="245" width="45.12820512820513" height="22" rx="2" fill="#a9bccb" stroke="none" stroke-width="0"/>
