<text x="320" y="213" font-size="14" font-weight="bold" text-anchor="start" fill="#202a2b">Cybernetic</text>
<rect x="465.1282051282051" y="197" width="174.8717948717949" height="22" rx="2" fill="#a9bccb" stroke="none" stroke-width="0"/>
<text x="459.1282051282051" y="212" font-size="11.5" font-weight="normal" text-anchor="end" fill="#405d73">31</text>
<rect x="640" y="197" width="39.48717948717949" height="22" rx="2" fill="#a8c6b6" stroke="none" stroke-width="0"/>
