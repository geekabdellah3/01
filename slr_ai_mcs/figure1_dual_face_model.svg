<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34444a"/></marker></defs><rect width="1200" height="890" fill="#fff"/><rect x="450" y="20" width="300" height="56" rx="4" fill="#f5f5f5" stroke="#4f5b60" stroke-width="1.5" /><text x="600" y="44" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#202a2b">AI and digital technologies</text><text x="600" y="64" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#58656a">forecasting, analytics, automation, big data</text><rect x="40" y="104" width="1120" height="616" rx="0" fill="none" stroke="#99a2a6" stroke-width="1.5" stroke-dasharray="7 5"/><text x="1144" y="126" font-size="14" font-weight="normal" font-style="italic" text-anchor="end" fill="#2b3639">Dynamic capabilities (Teece, 2007): co-evolving, not sequential</text><rect x="110" y="140" width="280" height="64" rx="4" fill="#f1f4f7" stroke="#71899a" stroke-width="1.5" /><text x="250" y="166" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle" fill="#405d73">Sensing</text><text x="250" y="188" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#202a2b">mobilises the capacity face of controls</text><rect x="460" y="140" width="280" height="64" rx="4" fill="#eff5f1" stroke="#6d9382" stroke-width="1.5" /><text x="600" y="166" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle" fill="#386754">Seizing</text><text x="600" y="188" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#202a2b">confronts the requirement face of controls</text><rect x="810" y="140" width="280" height="64" rx="4" fill="#f7f6f2" stroke="#8a8571" stroke-width="1.5" /><text x="950" y="166" font-size="17" font-weight="bold" font-style="normal" text-anchor="middle" fill="#5a5640">Transforming</text><text x="950" y="188" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#202a2b">re-couples both faces across the package</text><path d="M392 172 H456" stroke="#34444a" stroke-width="1.7" fill="none"  marker-start="url(#a)" marker-end="url(#a)"/><path d="M742 172 H806" stroke="#34444a" stroke-width="1.7" fill="none"  marker-start="url(#a)" marker-end="url(#a)"/><path d="M560 76 C560 100 250 100 250 136" stroke="#34444a" stroke-width="1.7" fill="none"   marker-end="url(#a)"/><text x="370" y="98" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#34444a">expands</text><path d="M640 76 C640 100 600 110 600 136" stroke="#34444a" stroke-width="1.7" fill="none"   marker-end="url(#a)"/><text x="690" y="98" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#34444a">generates</text><rect x="68" y="236" width="1024" height="372" rx="4" fill="#f8f9fa" stroke="#4f5b60" stroke-width="2" /><text x="80" y="260" font-size="14.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#303f41">MCS package (Malmi and Brown, 2008): every control has a capacity face and a requirement face</text><rect x="230" y="276" width="390" height="34" rx="0" fill="#f1f4f7" stroke="#71899a" stroke-width="1.2" /><text x="425.0" y="298" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#405d73">Capacity face (IPC): the control processes signals</text><rect x="690" y="276" width="390" height="34" rx="0" fill="#eff5f1" stroke="#6d9382" stroke-width="1.2" /><text x="885.0" y="298" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#386754">Requirement face (IPR): the control must adapt</text><rect x="80" y="310" width="150" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><text x="155.0" y="343.0" font-size="13.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#202a2b">Planning</text><rect x="230" y="310" width="390" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><rect x="690" y="310" width="390" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><text x="425.0" y="334" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#202a2b">“forecast future patterns and outcomes</text><text x="425.0" y="351" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#58656a">with more accuracy” (Alnor, 2024)</text><text x="885.0" y="334" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#202a2b">“changed the way managers work</text><text x="885.0" y="351" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#58656a">with planning” (Bredmar, 2017)</text><rect x="80" y="366" width="150" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><text x="155.0" y="399.0" font-size="13.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#202a2b">Cybernetic</text><rect x="230" y="366" width="390" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><rect x="690" y="366" width="390" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><text x="425.0" y="390" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#202a2b">“business process monitoring”</text><text x="425.0" y="407" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#58656a">(Caruso et al., 2023)</text><text x="885.0" y="390" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#202a2b">“KPI overload”</text><text x="885.0" y="407" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#58656a">(Caruso et al., 2023)</text><rect x="80" y="422" width="150" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><text x="155.0" y="455.0" font-size="13.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#202a2b">Administrative</text><rect x="230" y="422" width="390" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><rect x="690" y="422" width="390" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><text x="425.0" y="446" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#202a2b">“locus of information”</text><text x="425.0" y="463" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#58656a">(Gimpl et al., 2026)</text><text x="885.0" y="446" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#202a2b">“altering the roles and responsibilities</text><text x="885.0" y="463" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#58656a">of controllers” (Dounia et al., 2025)</text><rect x="80" y="478" width="150" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><text x="155.0" y="511.0" font-size="13.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#202a2b">Cultural</text><rect x="230" y="478" width="390" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><rect x="690" y="478" width="390" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><text x="425.0" y="502" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#202a2b">“cohesive corporate culture that supports</text><text x="425.0" y="519" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#58656a">the implementation” (Nguyen et al., 2024)</text><text x="885.0" y="502" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#202a2b">“resistance to change”</text><text x="885.0" y="519" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#58656a">(Getzin et al., 2026b)</text><rect x="80" y="534" width="150" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><text x="155.0" y="567.0" font-size="13.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#202a2b">Reward</text><rect x="230" y="534" width="390" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><rect x="690" y="534" width="390" height="56" rx="0" fill="#fff" stroke="#b9c1c5" stroke-width="1" /><text x="425.0" y="567.0" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#8a949a">no evidence in the corpus</text><text x="885.0" y="558" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#202a2b">“optimise employee incentives”</text><text x="885.0" y="575" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#58656a">(Nguyen et al., 2024)</text><rect x="626" y="276" width="58" height="314" rx="4" fill="#ffffff" stroke="#34444a" stroke-width="1.8" /><text x="660.0" y="433.0" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#202a2b" transform="rotate(-90 660.0 433.0)">Business Partner: translation</text><path d="M624 553.0 H618" stroke="#34444a" stroke-width="1.3" fill="none"   marker-end="url(#a)"/><path d="M686 553.0 H692" stroke="#34444a" stroke-width="1.3" fill="none"   marker-end="url(#a)"/><path d="M250 204 C250 216 425.0 214 425.0 233" stroke="#34444a" stroke-width="1.7" fill="none"   marker-end="url(#a)"/><path d="M600 204 C600 216 885.0 214 885.0 233" stroke="#34444a" stroke-width="1.7" fill="none"   marker-end="url(#a)"/><rect x="270" y="634" width="660" height="74" rx="4" fill="#fff" stroke="#4f5b60" stroke-width="1.6" /><text x="600" y="658" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#202a2b">Requirements–capacities fit within and across controls (OIPT)</text><text x="600" y="678" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#3a4651">AI expands capacity faces faster than requirement faces are addressed</text><text x="600" y="696" font-size="11" font-weight="normal" font-style="italic" text-anchor="middle" fill="#58656a">11 of 46 studies report requirements outpacing capacities; none the reverse</text><path d="M600 608 V630" stroke="#34444a" stroke-width="1.7" fill="none"   marker-end="url(#a)"/><path d="M950 204 C1110 260 1110 648 934 668" stroke="#34444a" stroke-width="1.7" fill="none"   marker-end="url(#a)"/><text x="1122" y="458" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="middle" fill="#5a5640" transform="rotate(-90 1122 458)">re-coupling</text><rect x="90" y="768" width="300" height="58" rx="4" fill="#fff" stroke="#596569" stroke-width="1.3" /><text x="240" y="802" font-size="13.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#202a2b">Substantial transformation</text><rect x="450" y="768" width="300" height="58" rx="4" fill="#fff" stroke="#596569" stroke-width="1.3" /><text x="600" y="802" font-size="13.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#202a2b">Limited adaptation</text><rect x="810" y="768" width="300" height="58" rx="4" fill="#fff" stroke="#596569" stroke-width="1.3" /><text x="960" y="792" font-size="13.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#202a2b">Persistence of practices</text><text x="960" y="810" font-size="13.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#202a2b">or ceremonial adoption</text><path d="M500 708 C500 748 240 738 240 764" stroke="#34444a" stroke-width="1.7" fill="none"   marker-end="url(#a)"/><path d="M600 708 V764" stroke="#34444a" stroke-width="1.7" fill="none"   marker-end="url(#a)"/><path d="M700 708 C700 748 960 738 960 764" stroke="#34444a" stroke-width="1.7" fill="none"   marker-end="url(#a)"/><rect x="320" y="736" width="60" height="16" fill="#fff"/><text x="350" y="748" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="middle" fill="#34444a">fit</text><rect x="570" y="736" width="60" height="16" fill="#fff"/><text x="600" y="748" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="middle" fill="#34444a">partial fit</text><rect x="820" y="736" width="60" height="16" fill="#fff"/><text x="850" y="748" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="middle" fill="#34444a">misfit</text><path d="M90 797 H22 V60 C22 46 220 46 446 46" stroke="#34444a" stroke-width="1.5" fill="none" stroke-dasharray="6 4"  marker-end="url(#a)"/><rect x="12" y="380" width="20" height="260" fill="#fff"/><text x="26" y="510" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="middle" fill="#34444a" transform="rotate(-90 26 510)">new signals and organisational learning</text><text x="600" y="868" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="middle" fill="#58656a">Capacity and requirement faces are functional roles, not control types: the same control can process signals and become the object of adaptation.</text></svg>