<path d="M250 300H296" fill="none" stroke="#34444a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1090" y="40" font-size="13" font-weight="bold" text-anchor="middle" fill="#58656a" letter-spacing="0.5">THE PROBLEM</text>
<text x="1090" y="58" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#8a949a">package asymmetry</text>
<rect x="945" y="100" width="300" height="250" rx="5" fill="#fdf6ef" stroke="#b5651d" stroke-width="1.8"/>
<text x="1095" y="132" font-size="16" font-weight="bold" text-anchor="middle" fill="#8a4512">Asymmetry of the package</text>
<text x="1095" y="162.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202a2b">AI strengthens the capacity face</text>
<text x="1095" y="179.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#202a2b">of planning and cybernetic controls</text>
<text x="1095" y="197.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202a2b">faster than the requirement face</text>
<text x="1095" y="214.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#202a2b">of administrative and cultural</text>
<text x="1095" y="232.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202a2b">controls is adapted.</text>
<text x="1095" y="267.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202a2b">Reward controls are almost absent.</text>
<text x="1095" y="302.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#202a2b">→ capacities and requirements</text>
<text x="1095" y="319.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#202a2b">drift apart: risk of misfit</text>
<path d="M900 225H941" fill="none" stroke="#34444a" stroke-width="1.6" marker-end="url(#a)"/>
<polygon points="30,490 413,490 435,530.0 413,570 30,570 30,530.0" fill="#f1f4f7" stroke="#71899a" stroke-width="1.5"/>
<text x="232.5" y="525" font-size="17" font-weight="bold" text-anchor="middle" fill="#405d73">1. Sensing</text>
<text x="232.5" y="547" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#58656a">mobilises the capacity face (IPC)</text>
<polygon points="440,490 823,490 845,530.0 823,570 440,570 462,530.0" fill="#eff5f1" stroke="#6d9382" stroke-width="1.5"/>
<text x="642.5" y="525" font-size="17" font-weight="bold" text-anchor="middle" fill="#386754">2. Seizing</text>
<text x="642.5" y="547" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#58656a">Business Partner translates IPC into IPR</text>
<polygon points="850,490 1228,490 1250,530.0 1228,570 850,570 872,530.0" fill="#f7f6f2" stroke="#8a8571" stroke-width="1.5"/>
<text x="1050.0" y="525" font-size="17" font-weight="bold" text-anchor="middle" fill="#5a5640">3. Transforming</text>
<text x="1050.0" y="547" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#58656a">adapts the requirement face (IPR)</text>
<text x="640" y="600" font-size="13" font-weight="bold" text-anchor="middle" fill="#58656a" letter-spacing="0.5">DYNAMIC CAPABILITIES AS PHASES</text>
<text x="640" y="618" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#8a949a">Teece (2007)</text>
