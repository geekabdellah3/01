<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
:root{--bg:#faf9f5;--fg:#1f1e1d;--user:#e9e6dc;--accent:#c96442;--border:#ddd9cc}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--fg:#f0eee6;--user:#3a3935;--border:#4a4943}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#log{flex:1;overflow-y:auto;padding:16px;max-width:760px;width:100%;margin:0 auto}
.msg{margin:12px 0;white-space:pre-wrap;word-wrap:break-word}
.user{background:var(--user);padding:10px 14px;border-radius:14px;margin-left:auto;width:fit-content;max-width:85%}
form{display:flex;gap:8px;padding:12px 16px;max-width:760px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:transparent;color:inherit;font:inherit;max-height:160px}
button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 18px;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:inherit;border:1px solid var(--border);padding:4px 12px}
select{background:transparent;color:inherit;border:1px solid var(--border);border-radius:8px;padding:4px;max-width:45vw}
select option{color:#000}
button:disabled{opacity:.5}
</style></head><body>
<header><strong>Chat</strong><select id="model"></select><button class="ghost" id="new">New chat</button></header>
<div id="log"></div>
<form id="f"><textarea id="q" rows="1" placeholder="Write a message…" autofocus></textarea><button id="send">Send</button></form>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),send=document.getElementById('send');
let history=[];
const sel=document.getElementById('model');
fetch('/api/models').then(r=>r.json()).then(({default:d,models})=>{
  for(const m of new Set([d,...models])){const o=document.createElement('option');o.value=o.textContent=m;sel.appendChild(o)}
  sel.value=d}).catch(()=>{});
const add=(role,text)=>{const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'bot');d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d};
document.getElementById('new').onclick=()=>{history=[];log.innerHTML=''};
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();f.requestSubmit()}});
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const text=q.value.trim();if(!text)return;
  q.value='';send.disabled=true;history.push({role:'user',content:text});add('user',text);
  const out=add('assistant','…');let full='';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,model:sel.value})});
    if(!r.ok)throw new Error(await r.text());
    const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const l of lines){if(!l.startsWith('data:'))continue;const p=l.slice(5).trim();if(!p||p==='[DONE]')continue;
        try{full+=JSON.parse(p).choices?.[0]?.delta?.content||'';out.textContent=full||'…';log.scrollTop=log.scrollHeight}catch{}}}
    history.push({role:'assistant',content:full});
  }catch(err){out.textContent='Error: '+err.message;history.pop()}
  send.disabled=false;q.focus();
};
</script></body></html>
